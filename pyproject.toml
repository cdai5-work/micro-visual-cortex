[project]
name = "micro-visual-cortex"
version = "0.1.0"
description = "Interactive retina-to-V1 spiking simulation demo"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.1,<3",
  "matplotlib>=3.9,<4",
  "gradio>=6,<7",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]>=0.6,<1"]
dev = ["pytest>=7.4,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
